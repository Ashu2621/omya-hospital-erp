apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: omya-hospital
spec:
  replicas: 2
  selector:
    matchLabels: { app: omya-backend }
  template:
    metadata:
      labels: { app: omya-backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: ghcr.io/your-org/omya-hospital-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9091 }
          envFrom:
            - configMapRef: { name: omya-config }
            - secretRef: { name: omya-secrets }
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-Djava.io.tmpdir=/tmp" }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            initialDelaySeconds: 35
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: omya-hospital
spec:
  selector: { app: omya-backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: management, port: 9091, targetPort: management }
