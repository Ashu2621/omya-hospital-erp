apiVersion: v1
kind: ConfigMap
metadata:
  name: omya-config
  namespace: omya-hospital
data:
  CACHE_TYPE: redis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_HEALTH_ENABLED: "true"
  DB_POOL_SIZE: "20"
  CORS_ALLOWED_ORIGINS: https://hospital.example.com
---
apiVersion: v1
kind: Secret
metadata:
  name: omya-secrets
  namespace: omya-hospital
type: Opaque
stringData:
  DATABASE_URL: replace-with-managed-postgresql-url
  DATABASE_USERNAME: replace-me
  DATABASE_PASSWORD: replace-me
  JWT_SECRET: replace-with-at-least-32-random-bytes
