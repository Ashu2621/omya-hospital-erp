spring:
  application:
    name: omya-hospital-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/omya_hospital}
    username: ${DATABASE_USERNAME:omya}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:4}
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cache:
    type: ${CACHE_TYPE:simple}
    redis:
      time-to-live: 5m
      cache-null-values: false
  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /api/v1
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
  error:
    include-message: never
    include-stacktrace: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4173}
    rate-limit:
      requests-per-minute: ${RATE_LIMIT_PER_MINUTE:120}
  bootstrap:
    admin:
      enabled: ${DEV_BOOTSTRAP_ADMIN:false}
      username: ${DEV_ADMIN_USERNAME:}
      password: ${DEV_ADMIN_PASSWORD:}
  subscriptions:
    renewal-cron: ${SUBSCRIPTION_RENEWAL_CRON:0 */5 * * * *}

management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%level","service":"${spring.application.name}","traceId":"%X{traceId:-}","logger":"%logger{36}","message":"%replace(%msg){''\"'',''\\"''}"}%n'
